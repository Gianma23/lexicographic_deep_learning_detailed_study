model:
  name: hcast
  variant: cast_small
  hidden_dim: 512      # fallback-only when timm stack unavailable
  dropout: 0.2         # fallback-only when timm stack unavailable

dataset:
  name: breeds
  root: ./data/imagenet
  hierarchy_depth: 2
  image_size: 224
  levels: [coarse, species]
  allow_synthetic_fallback: true

  # If set, this file is loaded from dataset.root
  taxonomy_file: null

  # Unified JSON annotations (optional)
  annotations:
    train: train.json
    val: val.json
    test: test.json

  # H-CAST breeds defaults (used when annotations are missing)
  breeds_sort: entity13
  breeds_train_source: true

dataloader:
  batch_size: 16
  num_workers: 2
  pin_memory: true

train:
  epochs: 2
  seed: 42
  device: cuda
  amp: true
  # H-CAST-style MixUp/CutMix defaults.
  mixup: 0.8
  cutmix: 1.0
  cutmix_minmax: null
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  mixup_mode: batch
  resume: ""
  output_dir: ./outputs/hcast

optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.05
  momentum: 0.9
  opt_eps: 1.0e-8
  opt_betas: null
  use_timm: true

scheduler:
  name: cosine
  warmup_lr: 0.0001
  min_lr: 0.00001
  decay_epochs: 30
  warmup_epochs: 5
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1
  lr_noise: null
  lr_noise_pct: 0.67
  lr_noise_std: 1.0
  use_timm: true

loss:
  beta_hv: 0.1
  alpha_tree_kl: 0.1
  globalkl: true
  gk_weight: 0.2

runtime:
  deterministic: true
