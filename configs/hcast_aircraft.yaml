model:
  name: hcast
  variant: cast_small
  # Official H-CAST uses ImageNet-pretrained CAST for CUB finetuning.
  finetune: https://huggingface.co/twke/CAST/blob/main/snapshots/deit/imagenet1k/cast_small/best_checkpoint.pth
  hidden_dim: 512
  dropout: 0.2
  segments:
    mode: seeds
    num_superpixels: 196
    num_levels: 1
    prior: 2
    histogram_bins: 5
    double_step: false
    num_iterations: 15
    patch_size: 8

dataset:
  name: fgvc-aircraft
  root: ./data/fgvc-aircraft-2013b
  hierarchy_depth: 3
  image_size: 224
  levels: [manufacturer, family, variant]
  allow_synthetic_fallback: true
  val_split_ratio: 0.1
  split_seed: null

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 64
  num_workers: 0
  windows_spawn_safe: true

train:
  epochs: 100
  seed: 42
  device: cuda
  amp: true
  resume: ""
  output_dir: ./outputs/hcast_aircraft
  # H-CAST-style MixUp/CutMix defaults.
  mixup: 0.8
  cutmix: 1.0
  cutmix_minmax: null
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  mixup_mode: batch
  smoothing: 0.1

optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.05
  momentum: 0.9
  opt_eps: 1.0e-8
  opt_betas: null
  use_timm: true

scheduler:
  name: cosine
  warmup_lr: 0.0001
  min_lr: 0.00001
  decay_epochs: 30
  warmup_epochs: 5
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1
  lr_noise: null
  lr_noise_pct: 0.67
  lr_noise_std: 1.0
  use_timm: true

loss:
  globalkl: true
  gk_weight: 0.5

runtime:
  deterministic: true
