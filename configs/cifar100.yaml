model:
  name: hcast
  variant: cast_small
  hidden_dim: 512
  dropout: 0.2

dataset:
  name: cifar-100
  root: ./data/cifar100
  hierarchy_depth: 3
  image_size: 32
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
  levels: [coarse1, coarse2, fine]
  allow_synthetic_fallback: true
  taxonomy_file: null
  download: true
  val_split_ratio: 0.1
  split_seed: null

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 256
  num_workers: 0
  pin_memory: false
  windows_spawn_safe: true

train:
  epochs: 50
  seed: 42
  device: cuda
  amp: true
  resume: ""
  output_dir: ./outputs/cifar100
  # H-CAST-style MixUp/CutMix defaults.
  mixup: 0.8
  cutmix: 1.0
  cutmix_minmax: null
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  mixup_mode: batch

optim:
  name: adamw
  lr: 0.0005
  weight_decay: 0.05
  momentum: 0.9
  opt_eps: 1.0e-8
  opt_betas: null
  use_timm: true

scheduler:
  name: cosine
  warmup_lr: 0.000001
  min_lr: 0.00001
  decay_epochs: 30
  warmup_epochs: 5
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1
  lr_noise: null
  lr_noise_pct: 0.67
  lr_noise_std: 1.0
  use_timm: true

loss:
  beta_hv: 0.1
  alpha_tree_kl: 0.5
  globalkl: true
  gk_weight: 0.5

runtime:
  deterministic: true
