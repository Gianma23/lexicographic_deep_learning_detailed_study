model:
  name: hcast
  variant: cast_small
  hidden_dim: 512
  dropout: 0.2

dataset:
  name: cifar-100
  root: ./data/cifar100
  hierarchy_depth: 3
  image_size: 32
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
  levels: [coarse1, coarse2, fine]
  allow_synthetic_fallback: true
  taxonomy_file: null
  download: true
  val_split_ratio: 0.1
  split_seed: null

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 64
  num_workers: 2
  pin_memory: true

train:
  epochs: 100
  seed: 42
  device: cuda
  amp: true
  resume: ""
  output_dir: ./outputs/cifar100

optim:
  name: adamw
  lr: 0.0003
  weight_decay: 0.0001

scheduler:
  name: cosine

loss:
  beta_hv: 0.1
  alpha_tree_kl: 0.1
  globalkl: true
  gk_weight: 0.2

runtime:
  deterministic: true
