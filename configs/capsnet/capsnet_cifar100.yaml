model:
  name: ht_capsnet
  caps_dim: 8
  secondary_dims: [64, 32, 16]
  routing_iters: 3

  num_blocks: 4
  initial_filters: 64
  filter_increment: 2
  backbone_net: efficientnet_b7
  backbone_net_weights: imagenet
  # Keras-compatible AutoAugment ImageNet weight conversion (explicitly tagged).
  backbone_variant: tf_efficientnet_b7.aa_in1k
  backbone_preprocessing: keras
  # Keras BN momentum=0.99 maps to PyTorch momentum=0.01. The application
  # progressively scales drop-connect to 0.2 across its blocks.
  backbone_bn_momentum: 0.01
  backbone_drop_path: 0.2

  # Taxonomy-guided routing controls
  taxonomy_temperature: 0.5
  mask_threshold_high: 0.99
  mask_threshold_low: 0.1
  mask_temperature: 0.5
  mask_center: 0.5

  # Cross-capsule attention
  attn_heads: 16
  attn_key_dim: 32
  attn_dropout: 0.0
  # Deviation from the released default (`layernorm`), which the paper also
  # specifies in Eq. (18) and Algorithm 1 line 20. That readout fixes every
  # capsule length at sqrt(d) regardless of input, so the class score used by
  # Eq. (10) and the margin loss in Eq. (19) carries no information: verified by
  # running the authors' TensorFlow code (initial lengths 8.00/5.66/4.00, fine
  # level separating 100 classes by 1.3e-06, fine accuracy 0.00 after 60 steps
  # on a 16-image memorisation test). `squash` restores the [0,1) length-as-
  # probability semantics of Eq. (6)/(16) that the margin loss is designed for.
  # See docs/htcapsnet_vs_keras_differences.md section 4.3.
  attn_postprocess: squash
  attn_initializer: keras_glorot
  loss:
    margin_m_pos: 0.9
    margin_m_neg: 0.1
    lambda_downweight: 0.5
    weight_mode: dynamic
    dynamic_weight: 0.0

dataset:
  name: cifar-100
  root: ${oc.env:CIFAR100_ROOT,/scratch/g.saggini1/datasets/cifar100}
  hierarchy_depth: 3
  # The paper keeps CIFAR-100 at its native 32x32 resolution.
  image_size: 32
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
  levels: [coarse1, coarse2, fine]
  download: true
  # The paper requires held-out validation but does not publish its CIFAR ratio;
  # retain the repository's stratified 90/10 train/validation protocol.
  val_split_ratio: 0.1
  split_seed: 0
  transforms:
    # CIFAR reaches the upstream array branch, which computes one scalar mean
    # and standard deviation over each complete train/validation/test split.
    fixed_resize_only: true
    fixed_resize_interpolation: bilinear
    fixed_resize_antialias: false
    use_timm: false
    normalization: standardscaler
    normalization_eps: 1.0e-7
    normalization_scope: dataset
    mixup: 0.2
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 1.0
    mixup_switch_prob: 0.0
    mixup_mode: elem
    mixup_pairing: random

dataloader:
  # run-HT-CapsNet.sh sets batch_size=32.
  batch_size: 64
  num_workers: 8
  pin_memory: true
  windows_spawn_safe: true
  # tf.data.padded_batch retains the final partial batch.
  drop_last_train: false

train:
  # Unified 100-epoch budget (upstream run-HT-CapsNet.sh sets epochs=200);
  # truncation only, the exponential schedule below is unchanged.
  epochs: 100
  seed: 42
  device: ${oc.env:TRAIN_DEVICE,cuda}
  amp: false
  resume: ""
  output_dir: ${oc.env:OUTPUTS_ROOT,/scratch/g.saggini1/outputs}/capsnet_cifar100
  smoothing: 0.0
  gradient_blocks: [p123, p23, p3]

optim:
  # Upstream optimizer default: Adam (lr=0.001).
  # Stock PyTorch Adam, not the Keras 2.8 epsilon-hat variant.
  name: adam
  lr: 0.001
  weight_decay: 0.0
  momentum: 0.9
  opt_eps: 1.0e-8
  opt_betas: null

scheduler:
  name: ht_capsnet_exponential
  start_epoch: 10
  decay_rate: 0.95

runtime:
  deterministic: true
