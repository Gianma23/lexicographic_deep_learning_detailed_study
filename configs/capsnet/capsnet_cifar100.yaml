model:
  name: ht_capsnet
  caps_dim: 8
  secondary_dims: [64, 32, 16]
  routing_iters: 3

  num_blocks: 4
  initial_filters: 64
  filter_increment: 2
  backbone_net: efficientnet_b7
  backbone_net_weights: imagenet

  # Taxonomy-guided routing controls
  taxonomy_temperature: 0.5
  mask_threshold_high: 0.99
  mask_threshold_low: 0.1
  mask_temperature: 0.5
  mask_center: 0.5

  # Cross-capsule attention
  attn_heads: 16
  attn_dropout: 0.0
  loss:
    margin_m_pos: 0.9
    margin_m_neg: 0.1
    lambda_downweight: 0.5
    weight_mode: dynamic
    dynamic_weight: 0.0

dataset:
  name: cifar-100
  root: /scratch/g.saggini1/datasets/cifar100
  hierarchy_depth: 3
  # Upstream parser default input_size is (64, 64, 3) unless explicitly overridden.
  image_size: 64
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
  levels: [coarse1, coarse2, fine]
  download: true
  # Keep dataset split policy aligned with H-CAST configs.
  val_split_ratio: 0.1
  split_seed: null
  transforms:
    # Keep HT-CapsNet parity preprocessing (fixed resize + per-image z-score normalization).
    fixed_resize_only: true
    fixed_resize_interpolation: bilinear
    use_timm: false
    normalization: standardscaler
    mixup: 0.2
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 1.0
    mixup_switch_prob: 0.0
    mixup_mode: batch

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  # run-HT-CapsNet.sh sets batch_size=32.
  batch_size: 32
  num_workers: 8
  pin_memory: true
  windows_spawn_safe: true

train:
  # run-HT-CapsNet.sh sets epochs=200.
  epochs: 100
  seed: 42
  device: cuda
  amp: true
  resume: /scratch/g.saggini1/outputs/capsnet_cifar100/latest.pt
  output_dir: /scratch/g.saggini1/outputs/capsnet_cifar100
  smoothing: 0.0

optim:
  # Upstream optimizer default: Adam (lr=0.001).
  name: adam
  lr: 0.001
  weight_decay: 0.0
  momentum: 0.9
  opt_eps: 1.0e-8
  opt_betas: null

scheduler:
  # Paper setting: LR_ExponentialDecay(initial_lr=0.001, start_epoch=10, decay=0.95).
  name: step
  warmup_lr: 0.001
  min_lr: 0.000001
  noise: null
  noise_pct: 0.67
  noise_std: 1.0
  noise_seed: 42
  decay_epochs: 1
  warmup_epochs: 10
  cooldown_epochs: 0
  patience_epochs: 10
  decay_rate: 0.95

runtime:
  deterministic: true
