model:
  name: ht_capsnet
  caps_dim: 8
  secondary_dims: [64, 32, 16]
  routing_iters: 3
  # Paper Eq. 4/Fig. 2 builds one primary-capsule tensor per hierarchy level.
  # source_reuse reproduces the released file's reshape of squashed 8-D capsules.
  primary_capsule_mode: paper_independent

  num_blocks: 4
  initial_filters: 64
  filter_increment: 2
  backbone_net: efficientnet_b7
  backbone_net_weights: imagenet
  # Keras-compatible AutoAugment ImageNet weight conversion (explicitly tagged).
  backbone_variant: tf_efficientnet_b7.aa_in1k
  backbone_preprocessing: keras
  # Keras BN momentum=0.99 maps to PyTorch momentum=0.01. The application
  # progressively scales drop-connect to 0.2 across its blocks.
  backbone_bn_momentum: 0.01
  backbone_drop_path: 0.2

  # Taxonomy-guided routing controls
  taxonomy_temperature: 0.5
  mask_threshold_high: 0.99
  mask_threshold_low: 0.1
  mask_temperature: 0.5
  mask_center: 0.5
  # Paper Eq. 13 uses the parent capsule norm directly. Use softmax_norm only
  # to reproduce the contradictory released TensorFlow layer.
  routing_parent_activation: norm

  # Cross-capsule attention
  attn_heads: 16
  attn_key_dim: 32
  attn_dropout: 0.0
  attn_postprocess: layernorm
  attn_initializer: keras_glorot
  loss:
    margin_m_pos: 0.9
    margin_m_neg: 0.1
    lambda_downweight: 0.5
    weight_mode: dynamic
    dynamic_weight: 0.0
    # Paper Eq. 21: (1 - accuracy) * initial_weight. The released callback
    # instead evaluates 1 - accuracy * initial_weight.
    dynamic_weight_formula: paper

dataset:
  name: cifar-100
  root: ${oc.env:CIFAR100_ROOT,/scratch/g.saggini1/datasets/cifar100}
  hierarchy_depth: 3
  # Paper/source CIFAR-100 run uses native 32x32 images.
  image_size: 32
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
  levels: [coarse1, coarse2, fine]
  download: true
  # Keep dataset split policy aligned with H-CAST configs.
  val_split_ratio: 0.1
  split_seed: 0
  transforms:
    # CIFAR reaches the upstream array branch, which computes one scalar mean
    # and standard deviation over each complete train/validation/test split.
    fixed_resize_only: true
    fixed_resize_interpolation: bilinear
    fixed_resize_antialias: false
    use_timm: false
    normalization: standardscaler
    normalization_eps: 1.0e-7
    normalization_scope: dataset
    mixup: 0.2
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 1.0
    mixup_switch_prob: 0.0
    mixup_mode: elem
    mixup_pairing: random

dataloader:
  # run-HT-CapsNet.sh sets batch_size=32.
  batch_size: 32
  num_workers: 8
  pin_memory: true
  windows_spawn_safe: true
  # tf.data.padded_batch retains the final partial batch.
  drop_last_train: false

train:
  # run-HT-CapsNet.sh sets epochs=200.
  epochs: 200
  seed: 42
  device: ${oc.env:TRAIN_DEVICE,cuda}
  amp: false
  resume: ""
  output_dir: ${oc.env:OUTPUTS_ROOT,/scratch/g.saggini1/outputs}/capsnet_cifar100
  smoothing: 0.0

optim:
  # Upstream optimizer default: Adam (lr=0.001).
  # Keras 2.8 epsilon-hat Adam update, not PyTorch's differently ordered form.
  name: keras_adam
  lr: 0.001
  weight_decay: 0.0
  momentum: 0.9
  opt_eps: 1.0e-7
  opt_betas: null

scheduler:
  name: ht_capsnet_exponential
  start_epoch: 10
  decay_rate: 0.95

runtime:
  deterministic: true
