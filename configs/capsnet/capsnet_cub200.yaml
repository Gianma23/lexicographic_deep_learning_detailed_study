model:
  name: ht_capsnet
  caps_dim: 8
  secondary_dims: [64, 32, 16]
  routing_iters: 3

  num_blocks: 4
  initial_filters: 64
  filter_increment: 2
  backbone_net: efficientnet_b7
  backbone_net_weights: imagenet

  # Taxonomy-guided routing controls
  taxonomy_temperature: 0.5
  mask_threshold_high: 0.99
  mask_threshold_low: 0.1
  mask_temperature: 0.5
  mask_center: 0.5

  # Cross-capsule attention
  attn_heads: 16
  attn_key_dim: 32
  attn_dropout: 0.0
  attn_postprocess: layernorm
  loss:
    margin_m_pos: 0.9
    margin_m_neg: 0.1
    lambda_downweight: 0.5
    weight_mode: dynamic
    dynamic_weight: 0.0

dataset:
  name: cub-200-2011
  root: ${oc.env:CUB200_ROOT,/scratch/g.saggini1/datasets/CUB_200_2011}
  hierarchy_depth: 3
  image_size: 64
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  levels: [order, family, species]
  # Unified-protocol taxonomy is 13/38/200; the paper run used 39/123/200.
  download: false
  # Keep dataset split policy aligned with H-CAST configs.
  val_split_ratio: 0.15
  split_seed: 0
  transforms:
    # Keep HT-CapsNet parity preprocessing (fixed resize + batch-scoped z-score
    # normalization). Upstream maps `Normalize_StandardScaler` over the batched
    # `tf.data` pipeline, so the statistic is reduced over the batch, not the image.
    fixed_resize_only: true
    fixed_resize_interpolation: bilinear
    # `tf.image.resize` defaults to antialias=False, so the source downsamples with
    # a fixed 2x2 kernel. Single-stage only: the source's 512px intermediate is a
    # `padded_batch` artifact and is deliberately not reproduced.
    fixed_resize_antialias: false
    use_timm: false
    normalization: standardscaler
    normalization_scope: batch
    mixup: 0.2
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 1.0
    mixup_switch_prob: 0.0
    mixup_mode: elem
    mixup_pairing: random

dataloader:
  # run-HT-CapsNet.sh sets batch_size=32.
  batch_size: 32
  num_workers: 8
  pin_memory: true
  windows_spawn_safe: true

train:
  # run-HT-CapsNet.sh sets epochs=200.
  epochs: 200
  seed: 42
  device: ${oc.env:TRAIN_DEVICE,cuda}
  amp: false
  resume: ""
  output_dir: ${oc.env:OUTPUTS_ROOT,/scratch/g.saggini1/outputs}/capsnet_cub200
  smoothing: 0.0

optim:
  name: adam
  lr: 0.001
  weight_decay: 0.0
  momentum: 0.9
  opt_eps: 1.0e-7
  opt_betas: null

scheduler:
  name: ht_capsnet_exponential
  start_epoch: 10
  decay_rate: 0.95

runtime:
  deterministic: true
