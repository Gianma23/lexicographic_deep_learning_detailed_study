model:
  name: ht_capsnet
  caps_dim: 8
  secondary_dims: [64, 32, 16]
  routing_iters: 3

  num_blocks: 4
  initial_filters: 64
  filter_increment: 2
  backbone_net: efficientnet_b7
  backbone_net_weights: imagenet
  backbone_variant: tf_efficientnet_b7.aa_in1k
  backbone_preprocessing: keras
  backbone_bn_momentum: 0.01
  backbone_drop_path: 0.2

  # Taxonomy-guided routing controls
  taxonomy_temperature: 0.5
  mask_threshold_high: 0.99
  mask_threshold_low: 0.1
  mask_temperature: 0.5
  mask_center: 0.5

  # Cross-capsule attention
  attn_heads: 16
  attn_key_dim: 32
  attn_dropout: 0.0
  # Deviation from the released `layernorm` readout; see capsnet_cifar100.yaml
  # for the rationale and docs/05-experiments.tex, "Baseline comparability".
  attn_postprocess: squash
  attn_initializer: keras_glorot
  loss:
    margin_m_pos: 0.9
    margin_m_neg: 0.1
    lambda_downweight: 0.5
    weight_mode: dynamic
    dynamic_weight: 0.0

dataset:
  name: cub-200-2011
  root: ${oc.env:CUB200_ROOT,/scratch/g.saggini1/datasets/CUB_200_2011}
  hierarchy_depth: 3
  image_size: 64
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  levels: [order, family, species]
  # Unified-protocol taxonomy is 13/38/200; the paper run used 39/123/200.
  download: false
  # Paper and source split claims conflict; retain the repository's honest
  # held-out training split instead of selecting on official test labels.
  val_split_ratio: 0.15
  split_seed: 0
  transforms:
    # Keep HT-CapsNet parity preprocessing (fixed resize + batch-scoped z-score
    # normalization). Upstream maps `Normalize_StandardScaler` over the batched
    # `tf.data` pipeline, so the statistic is reduced over the batch, not the image.
    fixed_resize_only: true
    fixed_resize_interpolation: bilinear
    # The released path loader resizes every decoded image to 512, batches it,
    # and then resizes the batch to the paper's 64px input size.
    fixed_resize_intermediate_size: 512
    fixed_resize_antialias: false
    use_timm: false
    normalization: standardscaler
    normalization_scope: batch
    mixup: 0.2
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 1.0
    mixup_switch_prob: 0.0
    mixup_mode: elem
    mixup_pairing: random

dataloader:
  # run-HT-CapsNet.sh sets batch_size=32.
  batch_size: 32
  num_workers: 8
  pin_memory: true
  windows_spawn_safe: true
  drop_last_train: false

train:
  # Unified 100-epoch budget (upstream run-HT-CapsNet.sh sets epochs=200);
  # truncation only, the exponential schedule below is unchanged.
  epochs: 100
  seed: 42
  device: ${oc.env:TRAIN_DEVICE,cuda}
  amp: false
  resume: ""
  output_dir: ${oc.env:OUTPUTS_ROOT,/scratch/g.saggini1/outputs}/capsnet_cub200
  smoothing: 0.0
  gradient_blocks: [p123, p23, p3]

optim:
  # Stock PyTorch Adam; see capsnet_cifar100.yaml for the rationale.
  name: adam
  lr: 0.001
  weight_decay: 0.0
  momentum: 0.9
  opt_eps: 1.0e-8
  opt_betas: null

scheduler:
  name: ht_capsnet_exponential
  start_epoch: 10
  decay_rate: 0.95

runtime:
  deterministic: true
