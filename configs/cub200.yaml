model:
  name: hcast
  variant: cast_small
  hidden_dim: 512
  dropout: 0.2

dataset:
  name: cub-200-2011
  root: ./data/cub
  hierarchy_depth: 3
  image_size: 224
  levels: [order, family, species]
  allow_synthetic_fallback: true
  taxonomy_file: null
  val_split_ratio: 0.1
  split_seed: null

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 16
  num_workers: 2
  pin_memory: true

train:
  epochs: 2
  seed: 42
  device: cuda
  amp: true
  resume: ""
  output_dir: ./outputs/cub200

optim:
  name: adamw
  lr: 0.0003
  weight_decay: 0.0001

scheduler:
  name: cosine

loss:
  beta_hv: 0.1
  alpha_tree_kl: 0.1
  globalkl: true
  gk_weight: 0.2

runtime:
  deterministic: true
