model:
  name: hrn
  backbone: resnet50
  pretrained: true
  branch_hidden_dim: 1024
  embedding_dim: 512
  dropout: 0.0
  trunk_lr_scale: 0.1

dataset:
  name: cub-200-2011
  root: /scratch/g.saggini1/datasets/CUB_200_2011
  hierarchy_depth: 3
  image_size: 448
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
  levels: [order, family, species]
  val_split_ratio: 0.2
  split_seed: null
  transforms:
    use_timm: false
    normalization: torchvision
    manual:
      crop_mode: random_resized_crop
      random_resized_crop_scale: [0.67, 1.0]
      random_resized_crop_ratio: [1.0, 1.0]
      interpolation: bilinear
      random_horizontal_flip_prob: 0.5
    eval:
      resize_mode: resize_center_crop
      # Approximate upstream 550->448 center crop ratio.
      crop_ratio: 0.8145454545
      interpolation: bilinear
    mixup: 0.0
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 0.0
    mixup_switch_prob: 0.5
    mixup_mode: batch

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 8
  num_workers: 4
  windows_spawn_safe: true

train:
  epochs: 100
  seed: 0
  device: cuda
  amp: false
  resume: ""
  output_dir: /scratch/g.saggini1/outputs/hrn_cub200
  smoothing: 0.0

optim:
  name: sgd
  lr: 0.002
  weight_decay: 0.0005
  momentum: 0.9

scheduler:
  name: cosine

runtime:
  deterministic: true
