model:
  name: hrn
  # CIFAR-specific HRN adaptation: use the same native-resolution WRN-28-8
  # geometry as Hier-COS and preserve an 8x8 map for HRN's RFM branches.
  backbone: wide_resnet
  pretrained: false
  wide_depth: 28
  wide_widen_factor: 8
  wide_drop_rate: 0.0
  branch_hidden_dim: 1024
  embedding_dim: 512
  dropout: 0.0
  trunk_lr_scale: 0.1

dataset:
  name: cifar-100
  root: ${oc.env:CIFAR100_ROOT,/scratch/g.saggini1/datasets/cifar100}
  hierarchy_depth: 3
  image_size: 32
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
  levels: [coarse1, coarse2, fine]
  download: true
  # Local extrapolation: preserve the unified repository's native CIFAR input protocol.
  val_split_ratio: 0.1
  split_seed: 0
  transforms:
    use_timm: false
    normalization: torchvision
    manual:
      crop_mode: random_crop
      random_crop_padding: 4
      random_crop_padding_mode: reflect
      random_horizontal_flip_prob: 0.5
      crop_bottom_pixels: 0
    eval:
      resize_mode: none
      crop_ratio: 1.0
      interpolation: bicubic
    mixup: 0.0
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 0.0
    mixup_switch_prob: 0.0
    mixup_mode: batch

dataloader:
  batch_size: 32
  num_workers: 4
  pin_memory: true
  windows_spawn_safe: true
  drop_last_train: true
  drop_last_eval: false

train:
  # Unified 100-epoch budget (upstream HRN uses 200); the cosine schedule
  # below is parameterised by train.epochs, so it is compressed, not truncated.
  epochs: 100
  seed: 0
  device: ${oc.env:TRAIN_DEVICE,cuda}
  amp: false
  resume: ""
  output_dir: ${oc.env:OUTPUTS_ROOT,/scratch/g.saggini1/outputs}/hrn_cifar100_wrn28_8
  smoothing: 0.0
  gradient_blocks: [p123, p23, p3]

optim:
  name: sgd
  lr: 0.002
  weight_decay: 0.0005
  momentum: 0.9

scheduler:
  name: cosine

runtime:
  deterministic: true
