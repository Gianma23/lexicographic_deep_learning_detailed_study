model:
  name: hrn
  backbone: resnet50
  pretrained: true
  branch_hidden_dim: 1024
  embedding_dim: 512
  dropout: 0.0
  trunk_lr_scale: 0.1

dataset:
  name: cifar-100
  root: /scratch/g.saggini1/datasets/cifar100
  hierarchy_depth: 3
  image_size: 32
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
  levels: [coarse1, coarse2, fine]
  download: true
  # Local extrapolation: HRN upstream does not provide CIFAR-100 experiments.
  val_split_ratio: 0.1
  split_seed: null
  transforms:
    use_timm: false
    normalization: torchvision
    manual:
      crop_mode: random_crop
      random_crop_padding: 4
      random_crop_padding_mode: reflect
      random_horizontal_flip_prob: 0.5
      crop_bottom_pixels: 0
    eval:
      resize_mode: none
      crop_ratio: 1.0
      interpolation: bicubic
    mixup: 0.0
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 0.0
    mixup_switch_prob: 0.0
    mixup_mode: batch

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 8
  num_workers: 4
  pin_memory: true
  windows_spawn_safe: true
  drop_last_train: true
  drop_last_eval: true

train:
  epochs: 100
  seed: 0
  device: cuda
  amp: false
  resume: ""
  output_dir: /scratch/g.saggini1/outputs/hrn_cifar100_parity
  smoothing: 0.0

optim:
  name: sgd
  lr: 0.002
  weight_decay: 0.0005
  momentum: 0.9

scheduler:
  name: cosine

runtime:
  deterministic: true
