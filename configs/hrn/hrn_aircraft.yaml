model:
  name: hrn
  backbone: resnet50
  pretrained: true
  branch_hidden_dim: 1024
  embedding_dim: 512
  dropout: 0.0
  trunk_lr_scale: 0.1

dataset:
  name: fgvc-aircraft
  root: ${oc.env:AIRCRAFT_ROOT,/scratch/g.saggini1/datasets/fgvc-aircraft-2013b}
  hierarchy_depth: 3
  image_size: 448
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
  levels: [manufacturer, family, variant]
  # Intentional clean-protocol choice: keep repo val split workflow.
  split_seed: 0
  transforms:
    use_timm: false
    normalization: torchvision
    manual:
      crop_mode: random_crop
      random_crop_padding: 8
      random_crop_padding_mode: constant
      resize_before_crop: true
      resize_before_crop_size: 550
      resize_before_crop_interpolation: bilinear
      interpolation: bilinear
      random_horizontal_flip_prob: 0.5
      crop_bottom_pixels: 0
    eval:
      resize_mode: resize_center_crop
      resize_size: 550
      resize_square: true
      crop_ratio: 0.8145454545
      interpolation: bilinear
    mixup: 0.0
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 0.0
    mixup_switch_prob: 0.0
    mixup_mode: batch

dataloader:
  batch_size: 8
  num_workers: 4
  pin_memory: true
  windows_spawn_safe: true
  drop_last_train: true
  drop_last_eval: false

train:
  # Unified 100-epoch budget (upstream HRN uses 200); the cosine schedule
  # below is parameterised by train.epochs, so it is compressed, not truncated.
  epochs: 100
  seed: 0
  device: ${oc.env:TRAIN_DEVICE,cuda}
  amp: false
  resume: ""
  output_dir: ${oc.env:OUTPUTS_ROOT,/scratch/g.saggini1/outputs}/hrn_aircraft_parity
  smoothing: 0.0

optim:
  name: sgd
  lr: 0.002
  weight_decay: 0.0005
  momentum: 0.9

scheduler:
  name: cosine

runtime:
  deterministic: true
