model:
  name: hrn
  backbone: resnet50
  pretrained: true
  branch_hidden_dim: 1024
  embedding_dim: 512
  dropout: 0.0

dataset:
  name: cub-200-2011
  root: ./data/CUB_200_2011
  hierarchy_depth: 3
  image_size: 224
  levels: [order, family, species]
  val_split_ratio: 0.1
  split_seed: null
  transforms:
    # Keep unified augmentation defaults to match the existing pipeline behavior.
    mixup: 0.8
    cutmix: 1.0
    cutmix_minmax: null
    mixup_prob: 1.0
    mixup_switch_prob: 0.5
    mixup_mode: batch

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 64
  num_workers: 8
  windows_spawn_safe: true

train:
  epochs: 100
  seed: 42
  device: cuda
  amp: true
  resume: ""
  output_dir: ./outputs/hrn_cub200
  mixup_enabled: false
  smoothing: 0.1

optim:
  name: sgd
  lr: 0.002
  weight_decay: 0.0005
  momentum: 0.9

scheduler:
  name: cosine

loss:
  tree_weight: 1.0
  fine_ce_weight: 1.0
  temperature: 1.0
  eps: 1.0e-8

runtime:
  deterministic: true
