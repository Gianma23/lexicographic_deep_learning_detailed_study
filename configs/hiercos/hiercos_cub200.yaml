model:
  name: hiercos
  loss: kl_reg
  ce_weight_mode: equal
  variant: haframe_resnet50
  pool: average
  pretrained: true
  alpha: 0.1
  backbone_lr_scale: 0.1
  fixed_frame_mode: orthonormal_random

dataset:
  name: cub-200-2011
  root: /scratch/g.saggini1/datasets/CUB_200_2011
  hierarchy_depth: 3
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  levels: [order, family, species]
  # Local extrapolation: Hier-COS upstream does not report CUB-200 runs.
  val_split_ratio: 0.2
  split_seed: null
  transforms:
    use_timm: false
    normalization: torchvision
    manual:
      crop_mode: random_crop
      random_crop_padding: 4
      random_crop_padding_mode: constant
      resize_before_crop: true
      resize_before_crop_size: 224
      interpolation: bilinear
      random_horizontal_flip_prob: 0.5
      crop_bottom_pixels: 0
    eval:
      resize_mode: resize
      resize_size: 224
      crop_ratio: 1.0
      interpolation: bilinear
    mixup: 0.0
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 0.0
    mixup_switch_prob: 0.0
    mixup_mode: batch

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 64
  num_workers: 8
  pin_memory: true
  windows_spawn_safe: true
  drop_last_train: true
  drop_last_eval: true

train:
  epochs: 100
  seed: 0
  device: cuda
  amp: true
  resume: ""
  output_dir: /scratch/g.saggini1/outputs/hiercos_cub200
  smoothing: 0.0

optim:
  name: sgd
  lr: 0.1
  weight_decay: 0.0005
  momentum: 0.9

scheduler:
  name: hiercos_cosine
  base_lr: 0.1

runtime:
  deterministic: true
