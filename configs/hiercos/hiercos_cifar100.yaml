model:
  name: hiercos
  loss: global_softmax_ce_reg
  weight_mode: equal
  variant: haframe_wide_resnet
  alpha: 0.05
  pretrained: false
  backbone_lr_scale: 0.1
  fixed_frame_mode: orthonormal_random
  wide_depth: 28
  wide_widen_factor: 8
  wide_drop_rate: 0.0

dataset:
  name: cifar-100
  root: ${oc.env:CIFAR100_ROOT,/scratch/g.saggini1/datasets/cifar100}
  hierarchy_depth: 3
  image_size: 32
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
  levels: [coarse1, coarse2, fine]
  download: true
  # Intentional clean-protocol choice: keep repo val split workflow (not upstream 50/class).
  val_split_ratio: 0.1
  split_seed: 0
  transforms:
    use_timm: false
    normalization: torchvision
    manual:
      crop_mode: random_crop
      random_crop_padding: 4
      random_crop_padding_mode: reflect
      random_horizontal_flip_prob: 0.5
      crop_bottom_pixels: 0
    eval:
      resize_mode: none
      crop_ratio: 1.0
      interpolation: bicubic
    mixup: 0.0
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 0.0
    mixup_switch_prob: 0.0
    mixup_mode: batch

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 64
  num_workers: 8
  pin_memory: true
  windows_spawn_safe: true
  drop_last_train: true
  drop_last_eval: true

train:
  epochs: 100
  seed: 0
  device: ${oc.env:TRAIN_DEVICE,cuda}
  amp: false
  resume: ""
  output_dir: ${oc.env:OUTPUTS_ROOT,/scratch/g.saggini1/outputs}/hiercos_cifar100_global_softmax_ce_reg_baseline_equal
  smoothing: 0.0

optim:
  name: sgd
  lr: 0.1
  weight_decay: 0.0005
  momentum: 0.9

scheduler:
  name: hiercos_cosine
  base_lr: 0.1

runtime:
  deterministic: true
