model:
  name: hiercos
  loss: global_softmax_ce_reg
  weight_mode: equal
  variant: haframe_resnet50
  pool: average
  pretrained: true
  alpha: 0.1
  backbone_lr_scale: 0.1
  fixed_frame_mode: orthonormal_random
  fixed_frame_per_level: false

dataset:
  name: fgvc-aircraft
  root: ${oc.env:AIRCRAFT_ROOT,/scratch/g.saggini1/datasets/fgvc-aircraft-2013b}
  hierarchy_depth: 3
  image_size: 224
  mean: [0.4880712, 0.5191783, 0.54383063]
  std: [0.21482512, 0.20683703, 0.23937796]
  levels: [manufacturer, family, variant]
  # Intentional clean-protocol choice: keep repo val split workflow.
  val_split_ratio: 0.2
  split_seed: 0
  transforms:
    use_timm: false
    normalization: torchvision
    manual:
      crop_mode: random_crop
      random_crop_padding: 4
      random_crop_padding_mode: constant
      resize_before_crop: true
      resize_before_crop_size: 224
      interpolation: bilinear
      random_horizontal_flip_prob: 0.5
      # Upstream preprocessing crops 20px from the bottom on FGVC-Aircraft.
      crop_bottom_pixels: 20
    eval:
      resize_mode: resize
      resize_size: 224
      crop_ratio: 1.0
      interpolation: bilinear
    mixup: 0.0
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 0.0
    mixup_switch_prob: 0.0
    mixup_mode: batch

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 64
  num_workers: 8
  pin_memory: true
  windows_spawn_safe: true
  drop_last_train: true
  drop_last_eval: true

train:
  epochs: 100
  seed: 0
  device: ${oc.env:TRAIN_DEVICE,cuda}
  amp: false
  resume: ""
  output_dir: ${oc.env:OUTPUTS_ROOT,/scratch/g.saggini1/outputs}/hiercos_aircraft_global_softmax_ce_reg_baseline_equal
  smoothing: 0.0

optim:
  name: sgd
  lr: 0.1
  weight_decay: 0.0005
  momentum: 0.9

scheduler:
  name: hiercos_cosine
  base_lr: 0.1

runtime:
  deterministic: true
