model:
  name: hiercos
  variant: haframe_resnet50
  feature_space: haf++
  pool: average
  # Upstream FGVC-Aircraft ResNet-50 backbone starts from ImageNet weights.
  pretrained: true
  alpha: 0.1
  backbone_lr_scale: 0.1

dataset:
  name: fgvc-aircraft
  root: /scratch/g.saggini1/datasets/fgvc-aircraft-2013b
  hierarchy_depth: 3
  image_size: 224
  mean: [0.4880712, 0.5191783, 0.54383063]
  std: [0.21482512, 0.20683703, 0.23937796]
  levels: [manufacturer, family, variant]
  val_split_ratio: 0.2
  split_seed: null
  transforms:
    use_timm: false
    normalization: torchvision
    manual:
      crop_mode: random_crop
      random_crop_padding: 4
      resize_before_crop: true
      resize_before_crop_size: 224
      interpolation: bilinear
      random_horizontal_flip_prob: 0.5
    eval:
      resize_mode: resize
      crop_ratio: 1.0
      interpolation: bilinear
    mixup: 0.0
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 0.0
    mixup_switch_prob: 0.0
    mixup_mode: batch

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 64
  num_workers: 8
  pin_memory: true
  windows_spawn_safe: true

train:
  epochs: 100
  seed: 0
  device: cuda
  amp: false
  resume: ""
  output_dir: /scratch/g.saggini1/outputs/hiercos_aircraft
  smoothing: 0.0

optim:
  name: sgd
  lr: 0.1
  weight_decay: 0.0005
  momentum: 0.9

scheduler:
  name: hiercos_cosine
  base_lr: 0.1

runtime:
  deterministic: true
