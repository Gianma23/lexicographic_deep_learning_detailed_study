model:
  name: hiercos
  loss: kl_reg
  weight_mode: kl_leaf
  variant: haframe_resnet50
  pool: average
  pretrained: true
  # Upstream Hier-COS iNaturalist19-224 uses alpha=0.001 and gamma=1.0.
  # The local Hier-COS loss exposes alpha; fixed-frame scaling keeps gamma=1 behavior.
  alpha: 0.001
  backbone_lr_scale: 0.1
  # Upstream --larger-backbone uses 0.01 for both f_theta and the ResNet trunk.
  transform_lr_scale: 0.1
  fixed_frame_mode: orthonormal_random
  fixed_frame_per_level: false

dataset:
  name: inat19
  root: ${oc.env:INAT19_ROOT,/scratch/g.saggini1/datasets/inat19}
  hierarchy_depth: 3
  image_size: 224
  mean: [0.454, 0.474, 0.367]
  std: [0.237, 0.230, 0.249]
  levels: [family, genus, species]
  download: false
  # Fixed Making Better Mistakes / Hier-COS split over official iNat19 train+val images.
  split_policy: explicit
  val_split_ratio: 0.0
  split_seed: 0
  transforms:
    use_timm: false
    normalization: torchvision
    manual:
      crop_mode: random_resized_crop
      interpolation: bilinear
      random_horizontal_flip_prob: 0.5
      crop_bottom_pixels: 0
    eval:
      resize_mode: resize
      resize_size: 224
      crop_ratio: 1.0
      interpolation: bilinear
    mixup: 0.0
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 0.0
    mixup_switch_prob: 0.0
    mixup_mode: batch

  annotations:
    train: annotations_mbm/train.json
    val: annotations_mbm/val.json
    test: annotations_mbm/test.json

dataloader:
  batch_size: 256
  num_workers: 8
  pin_memory: true
  windows_spawn_safe: true
  drop_last_train: true
  drop_last_eval: false

train:
  epochs: 100
  seed: 0
  device: ${oc.env:TRAIN_DEVICE,cuda}
  amp: false
  resume: ""
  output_dir: ${oc.env:OUTPUTS_ROOT,/scratch/g.saggini1/outputs}/hiercos_inat19_global_softmax_ce_reg_baseline_kl_leaf
  smoothing: 0.0

optim:
  name: sgd
  lr: 0.1
  weight_decay: 0.0005
  momentum: 0.9

scheduler:
  name: hiercos_cosine
  base_lr: 0.1

runtime:
  deterministic: true
  protocol: corrected_unified_v1
