model:
  name: hrn
  backbone: resnet50
  pretrained: true
  branch_hidden_dim: 1024
  embedding_dim: 512
  dropout: 0.0

dataset:
  name: cifar-100
  root: ./data/cifar100
  hierarchy_depth: 3
  image_size: 32
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
  levels: [coarse1, coarse2, fine]
  download: true
  val_split_ratio: 0.1
  split_seed: null

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 128
  num_workers: 0
  windows_spawn_safe: true

train:
  epochs: 100
  seed: 42
  device: cuda
  amp: true
  resume: ""
  output_dir: ./outputs/hrn_cifar100
  mixup: 0.8
  cutmix: 1.0
  cutmix_minmax: null
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  mixup_mode: batch
  smoothing: 0.1

optim:
  name: sgd
  lr: 0.002
  weight_decay: 0.0005
  momentum: 0.9
  use_timm: false

scheduler:
  name: cosine
  use_timm: false

loss:
  tree_weight: 1.0
  fine_ce_weight: 1.0
  temperature: 1.0
  eps: 1.0e-8

runtime:
  deterministic: true
