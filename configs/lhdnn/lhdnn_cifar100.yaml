model:
  name: lhdnn
  # Direct from LH-DNN paper (arXiv:2409.16956): large LH-DNN topology.
  projection:
    eps: 1.0e-6

dataset:
  name: cifar-100
  root: /scratch/g.saggini1/datasets/cifar100
  hierarchy_depth: 3
  image_size: 32
  in_channels: 3
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
  levels: [coarse1, coarse2, fine]
  download: true
  # Keep repo workflow (B-CNN used canonical train/test, but this repo requires a val split).
  val_split_ratio: 0.2
  split_seed: null
  transforms:
    # B-CNN reference (arXiv:1709.09890) reports training without data augmentation.
    use_timm: false
    normalization: torchvision
    manual:
      crop_mode: none
      random_crop_padding: 4
      random_resized_crop_scale: [0.08, 1.0]
      random_resized_crop_ratio: [0.75, 1.3333333333]
      interpolation: bicubic
      random_horizontal_flip_prob: 0.0
    eval:
      resize_mode: auto
      crop_ratio: 0.875
      interpolation: bicubic
    # Paper-style LH-DNN runs use hard labels (no MixUp/CutMix).
    mixup: 0.0
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 0.0
    mixup_switch_prob: 0.0
    mixup_mode: batch

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  # Direct from LH-DNN paper experiments section.
  batch_size: 128
  num_workers: 8
  pin_memory: true
  windows_spawn_safe: true

train:
  # Direct from LH-DNN paper for large LH-DNN on CIFAR-100.
  epochs: 15
  seed: 42
  device: cuda
  amp: true
  resume: ""
  output_dir: /scratch/g.saggini1/outputs/lhdnn_cifar100
  # Paper-faithful default CE behavior (label smoothing not specified in paper).
  smoothing: 0.0

optim:
  # Inherited from B-CNN reference setup used by LH-DNN paper.
  name: sgd
  lr: 0.001
  weight_decay: 0.0005
  momentum: 0.9

scheduler:
  # CIFAR-100 LH-DNN uses 0.001 then 0.0002, switched at epoch 11.
  name: step
  warmup_lr: 0.001
  min_lr: 0.0002
  noise: null
  noise_pct: 0.67
  noise_std: 1.0
  noise_seed: 42
  decay_epochs: 11
  warmup_epochs: 0
  cooldown_epochs: 0
  patience_epochs: 10
  decay_rate: 0.2

runtime:
  deterministic: true
