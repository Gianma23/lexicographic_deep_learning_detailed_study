model:
  name: lhdnn
  # Direct from LH-DNN paper (arXiv:2409.16956): large LH-DNN topology.
  projection:
    eps: 1.0e-6

dataset:
  name: cifar-100
  root: /scratch/g.saggini1/datasets/cifar100
  hierarchy_depth: 3
  image_size: 32
  in_channels: 3
  # B-CNN reference standardizes with a single CIFAR-wide mean/std; repeat it
  # across RGB channels for torchvision Normalize.
  mean: [0.4782, 0.4782, 0.4782]
  std: [0.2683, 0.2683, 0.2683]
  levels: [coarse1, coarse2, fine]
  download: true
  val_split_ratio: 0.2
  val_source: test
  split_seed: null
  transforms:
    # B-CNN reference (arXiv:1709.09890) reports training without data augmentation.
    use_timm: false
    normalization: torchvision
    manual:
      crop_mode: none
      random_crop_padding: 4
      random_resized_crop_scale: [0.08, 1.0]
      random_resized_crop_ratio: [0.75, 1.3333333333]
      interpolation: bicubic
      random_horizontal_flip_prob: 0.0
    eval:
      resize_mode: auto
      crop_ratio: 0.875
      interpolation: bicubic
    # Paper-style LH-DNN runs use hard labels (no MixUp/CutMix).
    mixup: 0.0
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 0.0
    mixup_switch_prob: 0.0
    mixup_mode: batch

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  # Direct from LH-DNN paper experiments section.
  batch_size: 128
  num_workers: 8
  pin_memory: true
  drop_last_train: false
  windows_spawn_safe: true

train:
  # Direct from LH-DNN paper for large LH-DNN on CIFAR-100.
  epochs: 30
  seed: 42
  device: cuda
  amp: false
  resume: ""
  output_dir: /scratch/g.saggini1/outputs/lhdnn_cifar100_v2
  # Paper-faithful default CE behavior (label smoothing not specified in paper).
  smoothing: 0.0

optim:
  # Inherited from B-CNN reference setup used by LH-DNN paper.
  name: sgd
  lr: 0.001
  weight_decay: 0.0
  momentum: 0.9
  nesterov: true

scheduler:
  # CIFAR-100 LH-DNN uses 0.001 then 0.0002, switched at epoch 11.
  name: step
  warmup_lr: 0.001
  min_lr: 0.0002
  noise: null
  noise_pct: 0.67
  noise_std: 1.0
  noise_seed: 42
  decay_epochs: 11
  warmup_epochs: 0
  cooldown_epochs: 0
  patience_epochs: 10
  decay_rate: 0.2

runtime:
  deterministic: true
