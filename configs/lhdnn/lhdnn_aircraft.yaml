model:
  name: lhdnn
  # Paper-aligned code path: fixed large LH-DNN topology.
  # Explicit large-image extrapolation: preserve the paper's 2x2 pre-head geometry.
  adaptive_pool_size: 2
  projection:
    eps: 1.0e-6

dataset:
  name: fgvc-aircraft
  root: ${oc.env:AIRCRAFT_ROOT,/scratch/g.saggini1/datasets/fgvc-aircraft-2013b}
  hierarchy_depth: 3
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  levels: [manufacturer, family, variant]
  download: false
  # Keep repo workflow (not paper-exact protocol) for best-checkpoint selection.
  split_seed: 0
  transforms:
    # Protocol extrapolation: the cited B-CNN/LH-DNN setup does not augment
    # training images. Deterministic resizing to 224 px is dataset-specific.
    use_timm: false
    normalization: torchvision
    fixed_resize_only: true
    fixed_resize_interpolation: bicubic
    # Extrapolated LH-DNN setup: no MixUp/CutMix.
    mixup: 0.0
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 0.0
    mixup_switch_prob: 0.0
    mixup_mode: batch

dataloader:
  # Kept aligned with LH-DNN paper training setup.
  batch_size: 128
  num_workers: 8
  pin_memory: true
  windows_spawn_safe: true

train:
  # Extrapolation: carry over the paper's large CIFAR-100 LH-DNN horizon.
  epochs: 15
  seed: 0
  device: ${oc.env:TRAIN_DEVICE,cuda}
  amp: false
  resume: ""
  output_dir: ${oc.env:OUTPUTS_ROOT,/scratch/g.saggini1/outputs}/lhdnn_aircraft
  smoothing: 0.0
  gradient_blocks: [p123, p1, p2, p3]

optim:
  # Extrapolation of the paper/reference optimizer: SGD, momentum 0.9,
  # Nesterov enabled, and no explicit weight decay.
  name: sgd
  lr: 0.001
  weight_decay: 0.0
  momentum: 0.9
  nesterov: true

scheduler:
  # Extrapolation of the large CIFAR-100 LH-DNN schedule: switch at epoch 11.
  name: step
  warmup_lr: 0.001
  min_lr: 0.0002
  noise: null
  noise_pct: 0.67
  noise_std: 1.0
  noise_seed: 42
  decay_epochs: 11
  warmup_epochs: 0
  cooldown_epochs: 0
  patience_epochs: 10
  decay_rate: 0.2

runtime:
  deterministic: true
