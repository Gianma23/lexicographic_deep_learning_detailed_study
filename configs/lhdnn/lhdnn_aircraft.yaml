model:
  name: lhdnn
  # Paper-aligned code path: fixed large LH-DNN topology.
  projection:
    eps: 1.0e-6

dataset:
  name: fgvc-aircraft
  root: /scratch/g.saggini1/datasets/fgvc-aircraft-2013b
  hierarchy_depth: 3
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  levels: [manufacturer, family, variant]
  download: false
  # Keep repo workflow (not paper-exact protocol) for best-checkpoint selection.
  val_split_ratio: 0.2
  split_seed: null
  transforms:
    use_timm: true
    normalization: torchvision
    timm:
      color_jitter: 0.3
      auto_augment: rand-m9-mstd0.5-inc1
      train_interpolation: bicubic
      random_erase:
        prob: 0.25
        mode: pixel
        count: 1
      # For image_size <= 32, timm train crop is replaced with RandomCrop(image_size, padding=4).
      small_image_random_crop_padding: 4
    eval:
      resize_mode: auto
      crop_ratio: 0.875
      interpolation: bicubic
    # Extrapolated LH-DNN setup: no MixUp/CutMix.
    mixup: 0.0
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 0.0
    mixup_switch_prob: 0.0
    mixup_mode: batch

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  # Kept aligned with LH-DNN paper training setup.
  batch_size: 128
  num_workers: 8
  pin_memory: true
  windows_spawn_safe: true

train:
  # Extrapolation choice for Aircraft: short LH-DNN horizon, consistent with paper style.
  epochs: 20
  seed: 0
  device: cuda
  amp: true
  resume: ""
  output_dir: /scratch/g.saggini1/outputs/lhdnn_aircraft
  smoothing: 0.0

optim:
  # Inherited training family from LH-DNN paper (SGD + momentum), extrapolated to Aircraft.
  name: sgd
  lr: 0.001
  weight_decay: 0.0005
  momentum: 0.9

scheduler:
  # Extrapolation for Aircraft: same two-stage style used in paper-reported CIFAR runs.
  name: step
  warmup_lr: 0.001
  min_lr: 0.0002
  noise: null
  noise_pct: 0.67
  noise_std: 1.0
  noise_seed: 42
  decay_epochs: 11
  warmup_epochs: 0
  cooldown_epochs: 0
  patience_epochs: 10
  decay_rate: 0.2

runtime:
  deterministic: true
