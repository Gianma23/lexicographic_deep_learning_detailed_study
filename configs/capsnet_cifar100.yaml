model:
  name: ht_capsnet
  caps_dim: 16
  secondary_dims: [16, 16, 16]
  routing_iters: 3

  # Backbone (PyTorch translation of upstream custom blocks)
  num_blocks: 4
  initial_filters: 64
  filter_increment: 2

  # Taxonomy-guided routing controls
  taxonomy_temperature: 5.0
  mask_threshold_high: 0.9
  mask_threshold_low: 0.1
  mask_temperature: 0.5
  mask_center: 0.5

  # Cross-capsule attention
  attn_heads: 4
  attn_dropout: 0.0

dataset:
  name: cifar-100
  root: ./data/cifar100
  hierarchy_depth: 3
  image_size: 32
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
  levels: [coarse1, coarse2, fine]
  allow_synthetic_fallback: true
  download: true
  val_split_ratio: 0.1
  split_seed: null
  transforms:
    # H-CAST-style MixUp/CutMix defaults.
    mixup: 0.8
    cutmix: 1.0
    cutmix_minmax: null
    mixup_prob: 1.0
    mixup_switch_prob: 0.5
    mixup_mode: batch

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 256
  num_workers: 0
  windows_spawn_safe: true

train:
  epochs: 100
  seed: 42
  device: cuda
  amp: true
  resume: ""
  output_dir: ./outputs/capsnet_cifar100
  mixup_enabled: false
  smoothing: 0.1

optim:
  name: adamw
  lr: 0.0005
  weight_decay: 0.05
  momentum: 0.9
  opt_eps: 1.0e-8
  opt_betas: null

scheduler:
  name: cosine
  warmup_lr: 0.000001
  min_lr: 0.00001
  decay_epochs: 30
  warmup_epochs: 5
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1

loss:
  margin_m_pos: 0.9
  margin_m_neg: 0.1
  lambda_downweight: 0.5
  hier_weight: 0.2
  level_weights: [0.2, 0.3, 0.5]

runtime:
  deterministic: true
