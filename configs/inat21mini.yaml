model:
  name: hcast
  variant: cast_small
  segments:
    mode: seeds
    num_superpixels: 196
    num_levels: 1
    prior: 2
    histogram_bins: 5
    double_step: false
    num_iterations: 15
    patch_size: 8

dataset:
  name: inat21-mini
  root: ./data/inat21mini
  hierarchy_depth: 3
  image_size: 224
  levels: [order, family, species]
  allow_synthetic_fallback: true
  val_split_ratio: 0.1
  split_seed: null
  transforms:
    use_timm: true
    normalization: torchvision
    timm:
      color_jitter: 0.3
      auto_augment: rand-m9-mstd0.5-inc1
      train_interpolation: bicubic
      random_erase:
        prob: 0.25
        mode: pixel
        count: 1
    eval:
      resize_mode: auto
      crop_ratio: 0.875
      interpolation: bicubic
    mixup: 0.0
    cutmix: 0.0
    cutmix_minmax: null
    mixup_prob: 1.0
    mixup_switch_prob: 0.5
    mixup_mode: batch

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 16
  num_workers: 2

train:
  epochs: 2
  seed: 42
  device: cuda
  amp: true
  resume: ""
  output_dir: ./outputs/inat21mini
  mixup_enabled: false
  smoothing: 0.1

optim:
  name: adamw
  lr: 0.0005
  weight_decay: 0.05
  momentum: 0.9
  opt_eps: 1.0e-8
  opt_betas: null

scheduler:
  name: cosine
  warmup_lr: 0.000001
  min_lr: 0.00001
  decay_epochs: 30
  warmup_epochs: 5
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1

loss:
  globalkl: true
  gk_weight: 0.2

runtime:
  deterministic: true
