model:
  name: hcast
  variant: cast_small
  hidden_dim: 512
  dropout: 0.2

dataset:
  name: fgvc-aircraft
  root: ./data/aircraft
  hierarchy_depth: 3
  image_size: 224
  levels: [manufacturer, family, variant]
  allow_synthetic_fallback: true
  taxonomy_file: null
  val_split_ratio: 0.1
  split_seed: null

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 16
  num_workers: 2
  pin_memory: true

train:
  epochs: 2
  seed: 42
  device: cuda
  amp: true
  resume: ""
  output_dir: ./outputs/aircraft

optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.05
  momentum: 0.9
  opt_eps: 1.0e-8
  opt_betas: null
  use_timm: true

scheduler:
  name: cosine
  warmup_lr: 0.0001
  min_lr: 0.00001
  decay_epochs: 30
  warmup_epochs: 5
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1
  lr_noise: null
  lr_noise_pct: 0.67
  lr_noise_std: 1.0
  use_timm: true

loss:
  beta_hv: 0.1
  alpha_tree_kl: 0.1
  globalkl: true
  gk_weight: 0.2

runtime:
  deterministic: true
