model:
  name: lhdnn
  variant: small
  projection:
    enabled: true
    eps: 1.0e-6
    use_relu_derivative: true
  advantage:
    enabled: true
  custom:
    channels: [64, 128, 256]
    shared_dim: 256

dataset:
  name: cifar-100
  root: /scratch/g.saggini1/datasets/cifar100
  hierarchy_depth: 3
  image_size: 32
  in_channels: 3
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
  levels: [coarse1, coarse2, fine]
  download: true
  val_split_ratio: 0.2
  split_seed: null
  transforms:
    use_timm: false
    normalization: torchvision
    manual:
      crop_mode: random_crop
      random_crop_padding: 4
      random_horizontal_flip_prob: 0.5
      interpolation: bicubic
      random_resized_crop_scale: [0.08, 1.0]
      random_resized_crop_ratio: [0.75, 1.3333333333]
    eval:
      resize_mode: auto
      crop_ratio: 0.875
      interpolation: bicubic
    mixup: 0.8
    cutmix: 1.0
    cutmix_minmax: null
    mixup_prob: 1.0
    mixup_switch_prob: 0.5
    mixup_mode: batch

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 128
  num_workers: 8
  pin_memory: true
  windows_spawn_safe: true

train:
  epochs: 100
  seed: 0
  device: cuda
  amp: true
  resume: ""
  output_dir: ./outputs/lhdnn_cifar100_small
  smoothing: 0.1

optim:
  name: sgd
  lr: 0.001
  weight_decay: 0.0005
  momentum: 0.9

scheduler:
  name: cosine

runtime:
  deterministic: true
