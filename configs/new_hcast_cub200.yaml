model:
  name: hcast
  variant: cast_small
  # Official H-CAST uses ImageNet-pretrained CAST for CUB finetuning.
  finetune: https://huggingface.co/twke/CAST/blob/main/snapshots/deit/imagenet1k/cast_small/best_checkpoint.pth
  segments:
    mode: seeds
    num_superpixels: 196
    num_levels: 1
    prior: 2
    histogram_bins: 5
    double_step: false
    num_iterations: 15
    patch_size: 8
  lexproj:
    enabled: true
    scope: train_eval
    eta_lower: 2.5
    eta_upper: 2.5
    lower_iter_k: 3
    coarse_tol: 2e-3
    middle_tol: 2e-3
    backtrack_factor: 0.5
    backtrack_max_steps: 6
    eps: 1e-12

dataset:
  name: cub-200-2011
  root: ./data/CUB_200_2011
  hierarchy_depth: 3
  image_size: 224
  levels: [order, family, species]
  val_split_ratio: 0.1
  split_seed: null
  transforms:
    use_timm: true
    color_jitter: 0.3
    aa: rand-m9-mstd0.5-inc1
    train_interpolation: bicubic
    reprob: 0.25
    remode: pixel
    recount: 1
    eval_crop_ratio: 0.875
  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 64
  num_workers: 0
  windows_spawn_safe: true

train:
  epochs: 100
  seed: 42
  device: cuda
  amp: true
  resume: ""
  output_dir: ./outputs/new_hcast_cub200
  mixup_enabled: true
  # H-CAST-style MixUp/CutMix defaults.
  mixup: 0.8
  cutmix: 1.0
  cutmix_minmax: null
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  mixup_mode: batch
  smoothing: 0.1

optim:
  name: adamw
  lr: 0.0005
  weight_decay: 0.05
  momentum: 0.9
  opt_eps: 1.0e-8
  opt_betas: null

scheduler:
  name: cosine
  warmup_lr: 0.000001
  min_lr: 0.00001
  decay_epochs: 30
  warmup_epochs: 5
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1

loss:
  globalkl: true
  gk_weight: 0.5

runtime:
  deterministic: true
