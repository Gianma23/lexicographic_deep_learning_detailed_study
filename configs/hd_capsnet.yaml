model:
  name: hd_capsnet
  caps_dim: 16
  secondary_dims: [16, 16, 16]
  routing_iters: 3

  # Backbone (PyTorch translation of upstream custom blocks)
  num_blocks: 4
  initial_filters: 64
  filter_increment: 2

dataset:
  name: cifar-100
  root: ./data/cifar100
  hierarchy_depth: 3
  image_size: 32
  mean: [0.5071, 0.4867, 0.4408]
  std: [0.2675, 0.2565, 0.2761]
  levels: [coarse1, coarse2, fine]
  allow_synthetic_fallback: true
  taxonomy_file: null
  download: false
  val_split_ratio: 0.1
  split_seed: null

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 16
  num_workers: 2
  pin_memory: true

train:
  epochs: 100
  seed: 42
  device: cuda
  amp: true
  resume: ""
  output_dir: ./outputs/hd_capsnet

optim:
  name: adamw
  lr: 0.0003
  weight_decay: 0.0001

scheduler:
  name: cosine

loss:
  margin_m_pos: 0.9
  margin_m_neg: 0.1
  lambda_downweight: 0.5
  level_weights: [0.2, 0.3, 0.5]

runtime:
  deterministic: true
