model:
  name: ht_capsnet
  caps_dim: 16
  secondary_dims: [16, 16, 16]
  routing_iters: 3

  # Backbone (PyTorch translation of upstream custom blocks)
  num_blocks: 4
  initial_filters: 64
  filter_increment: 2

  # Taxonomy-guided routing controls
  taxonomy_temperature: 5.0
  mask_threshold_high: 0.9
  mask_threshold_low: 0.1
  mask_temperature: 0.5
  mask_center: 0.5

  # Cross-capsule attention
  attn_heads: 4
  attn_dropout: 0.0

dataset:
  name: cub-200-2011
  root: ./data/CUB_200_2011
  hierarchy_depth: 3
  image_size: 224
  levels: [order, family, species]
  allow_synthetic_fallback: true
  val_split_ratio: 0.1
  split_seed: null

  annotations:
    train: train.json
    val: val.json
    test: test.json

dataloader:
  batch_size: 64
  num_workers: 8
  windows_spawn_safe: true

train:
  epochs: 200
  seed: 42
  device: cuda
  amp: true
  resume: ""
  output_dir: ./outputs/capsnet_cub200
  # H-CAST-style MixUp/CutMix defaults.
  mixup: 0.8
  cutmix: 1.0
  cutmix_minmax: null
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  mixup_mode: batch
  smoothing: 0.1

optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.95
  momentum: 0.9
  opt_eps: 1.0e-8
  opt_betas: null
  use_timm: true

scheduler:
  name: cosine
  warmup_lr: 0.000001
  min_lr: 0.00001
  decay_epochs: 30
  warmup_epochs: 10
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1
  lr_noise: null
  lr_noise_pct: 0.67
  lr_noise_std: 1.0
  use_timm: true

loss:
  margin_m_pos: 0.9
  margin_m_neg: 0.1
  lambda_downweight: 0.5
  hier_weight: 0.2
  level_weights: [0.2, 0.3, 0.5]

runtime:
  deterministic: true

