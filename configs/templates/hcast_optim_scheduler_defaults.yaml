# H-CAST optimizer/scheduler defaults from:
# https://github.com/pseulki/HCAST (deit/main_suppix_hier.py)
#
# Note:
# - train.epochs is included because timm scheduler creation uses it.
# - lr/warmup_lr can be overridden per dataset (e.g., Aircraft README uses 0.001/0.0001).
model:
  name: hcast
  variant: cast_small
  drop: 0.0
  drop_path: 0.1
  # Official H-CAST uses ImageNet-pretrained CAST for CUB finetuning.
  finetune: https://huggingface.co/twke/CAST/blob/main/snapshots/deit/imagenet1k/cast_small/best_checkpoint.pth
  segments:
    mode: seeds
    # for seeds mode
    num_superpixels: 196
    num_levels: 1
    prior: 2
    histogram_bins: 5
    double_step: false
    num_iterations: 15
    # for grid mode
    patch_size: 8
  loss:
    globalkl: true
    gk_weight: 0.5

train:
  epochs: 100

optim:
  name: adamw
  lr: 0.0005
  weight_decay: 0.05
  momentum: 0.9
  opt_eps: 1.0e-8
  opt_betas: null

scheduler:
  name: cosine
  warmup_lr: 0.000001
  min_lr: 0.00001
  noise: null
  noise_pct: 0.67
  noise_std: 1.0
  noise_seed: 42
  decay_epochs: 30
  warmup_epochs: 5
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1
