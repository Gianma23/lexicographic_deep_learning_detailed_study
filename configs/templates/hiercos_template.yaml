# Template for the `model:` section when using Hier-COS.
# Constraints:
# - Hier-COS requires taxonomy.parent_of mappings.
# - Hier-COS requires at least two hierarchy levels.
model:
  name: hiercos                     # Model registry id. Must be exactly: hiercos
  loss: kl_reg                      # kl_reg | global_softmax_ce_reg | level_softmax_ce_reg
  # Path/CE weights; regularization stays unweighted.
  # cumulative_branching uses C_l^weight_beta / sum_k C_k^weight_beta.
  # marginal_branching uses normalized [1, C_1/C_0, ..., C_l/C_(l-1)].
  weight_mode: kl_leaf              # equal | kl_leaf | kl_coarse | cumulative_branching | marginal_branching
  weight_beta: 0.5                  # Native Hier-COS only; used by cumulative_branching and ignored otherwise
  variant: haframe_resnet50         # haframe_resnet50 | haframe_wide_resnet
  pool: average                     # Pooling for resnet50 variant: max | average
  pretrained: true                  # Used by resnet50 variant; wide variant is trained from scratch
  alpha: 0.1                        # Weight of level regularization in all supported loss modes
  backbone_lr_scale: 0.1            # LR multiplier for backbone parameter group (SGD path)
  transform_lr_scale: 1.0           # LR multiplier for f_theta on resnet50; set 0.1 to match upstream --larger-backbone
  fixed_frame_mode: orthonormal_random # orthonormal_random | identity; legacy: orthonormal_block_random
  fixed_frame_per_level: false      # false = one global fixed layer; true = one frozen block per hierarchy level

  # Optional LH-style projection after the complete transform. Projection keeps
  # the transform's PReLU activations and residual skips unchanged, then inserts
  # a shared terminal PReLU whose derivative enters the projection matrix as
  # A[b]=[W_1; ...; W_(l-1)] * rho'(k[b]). That derivative is part of the LH
  # method and is always applied.
  # Each projected branch has a learnable FC head; the level outputs are
  # concatenated and passed through an identity or per-level block-diagonal
  # fixed frame; a dense global frame would mix the independent LH branches.
  # It requires loss=level_softmax_ce_reg and cannot use
  # train.lexicographic.enabled=true.
  projection:
    enabled: false                  # true enables the projected learnable level heads
    advantage_enabled: false        # true recursively adds detached parent scores after fixed-frame abs
    feature_dim: 0                  # Shared width, projection only; 0 uses sum(num_classes_per_level)
    eps: 1.0e-6                     # Stabilizer for the projection solve

  # Used only when variant=haframe_wide_resnet
  wide_depth: 28                    # WideResNet depth; must satisfy (depth - 4) % 6 == 0
  wide_widen_factor: 8              # WideResNet channel multiplier
  wide_drop_rate: 0.0               # WideResNet dropout inside residual blocks
