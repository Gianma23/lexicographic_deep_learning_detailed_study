# Optional post-logit orthonormal taxonomy-frame plugin.
# Constraints:
# - Requires taxonomy.parent_of mappings.
# - Consumes model output key `orthonormal_plugin_scores_per_level`.
# - Does not support MixUp/CutMix soft targets.
orthonormal_plugin:
  enabled: false                    # true wraps non-Hier-COS models with the plugin
  loss: global_softmax_ce_reg       # kl_reg | global_softmax_ce_reg | level_softmax_ce_reg
  weight_mode: equal                # equal | kl_leaf | kl_coarse
  alpha: 0.05                       # Weight of level regularization
  transform_mode: full              # full | bn_linear | final_only
  fixed_frame_mode: orthonormal_random # orthonormal_random | identity; legacy: orthonormal_block_random
  fixed_frame_per_level: false      # false = one global fixed layer; true = one frozen block per hierarchy level
  transform_lr_scale: 1.0           # SGD LR multiplier for trainable transform parameters
