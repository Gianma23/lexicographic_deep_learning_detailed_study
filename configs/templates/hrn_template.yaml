# Template for the `model:` section when using HRN.
# Constraint: HRN supports exactly three hierarchy levels.
model:
  name: hrn                         # Model registry id. Must be exactly: hrn
  loss: native                      # native | level_conditional; HRN lex requires level_conditional
  backbone: resnet50                # resnet50 | wide_resnet (CIFAR-native adaptation)
  pretrained: true                  # ResNet-50 only; wide_resnet requires false
  wide_depth: 28                    # WideResNet only; must satisfy (depth - 4) % 6 == 0
  wide_widen_factor: 8              # WideResNet channel multiplier
  wide_drop_rate: 0.0               # WideResNet residual-block dropout
  branch_hidden_dim: 1024           # Native HRN only; projected HRN replaces the branch stack
  embedding_dim: 512                # Native HRN only; projected heads map trunk width directly to classes
  dropout: 0.0                      # Native branch FC dropout; must be 0 with projection
  trunk_lr_scale: 0.1               # LR multiplier for backbone trunk parameter group (SGD path)
  projection:                       # LH-DNN projection at the HRN branching point
    enabled: false                  # true uses pooled shared Linear+ReLU, direct D->C_l heads, and score-space advantage
    eps: 1.0e-6                     # Stabilizer for the projection solve
