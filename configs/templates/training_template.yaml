# Template for shared training/runtime sections: `train`, `optim`, `scheduler`, `runtime`.

train:
  epochs: 100                       # Total training epochs
  seed: 0                           # Global RNG seed
  device: ${oc.env:TRAIN_DEVICE,cuda} # cuda | cpu
  amp: true                         # Enable automatic mixed precision on CUDA
  progress_bar: true                # Enable tqdm progress bar when available
  resume: ""                        # Optional checkpoint path to resume from
  output_dir: ${oc.env:OUTPUTS_ROOT,/scratch/g.saggini1/outputs}/<run_name> # Run artifact directory
  smoothing: 0.1                    # Label smoothing in CE-based losses
  stop_epoch: 100                   # Optional early stop epoch; must satisfy 1 <= stop_epoch <= epochs

  # Optional linear LR scaling by batch size.
  scale_lr: false                   # If true, final LR = optim.lr * batch_size / reference_batch_size
  scale_lr_reference_batch_size: 512

  # Exact gradient-support blocks to diagnose. A baseline should list every
  # nonempty support block; a lex launcher should override this with only the
  # multi-objective blocks that can be projected. This default is H-CAST's full
  # baseline partition; family-specific configs provide their own lists.
  gradient_blocks: [p123, p12, p1, p2, p3]

  # Optional lexicographic projected-gradient mode.
  # Supported when exactly 3 differentiable level losses are available.
  # When enabled, projection is active for the whole run (epoch 0 to the end).
  lexicographic:
    enabled: false                  # true enables projected gradient composition
    projection_mode: coarse_first   # coarse_first | fine_first
    eps: 1.0e-12                    # Numerical epsilon for projection denominators
    log_metrics: true               # Emit projection diagnostics in train metrics

  # Optional capability-based direct supervision of taxonomy-subspace scores.
  # When enabled, this replaces the model's native loss. The model output must
  # expose subspace_scores_per_level and subspace_path_overlap_by_level.
  # The target is not a one-hot label: a subspace spans ancestors, self and
  # descendants, so classes sharing an ancestor necessarily share coordinates
  # and a one-hot target is unreachable. Supervision uses the attainable profile
  # induced by unit path energy split over the ground-truth path, compared
  # against the decoded scores through a tempered soft cross-entropy, after
  # dividing the scores by the node-coordinate norm -- one scale shared by every
  # level, since a per-level scale would leave the node energies unidentified.
  # Level weights are not set here: the mechanism reuses model.weight_mode to
  # split the path energy in the target geometry. The per-level losses are then
  # averaged uniformly, so a level's importance is expressed once.
  # It is incompatible with mixup/cutmix, HCC, lexicographic training, and the
  # Hier-COS LH projection.
  subspace_supervision:
    enabled: false
    tau: 0.25                       # Target/prediction temperature; ->0 recovers the
                                    # unreachable one-hot target, large flattens it
    eps: 1.0e-12                    # Numerical epsilon for the shared score scale

optim:
  name: adamw                       # adam | adamw | sgd
  lr: 0.0005                        # Base LR (or scaled base LR if train.scale_lr=true)
  weight_decay: 0.05
  momentum: 0.9                     # Used by sgd
  nesterov: false                   # Used by sgd
  opt_eps: 1.0e-8                   # Optional Adam/AdamW epsilon (null uses torch default)
  opt_betas: null                   # Optional [beta1, beta2] for Adam/AdamW

scheduler:
  # Supported families:
  # - none
  # - hiercos_cosine (custom scheduler; uses base_lr and train.epochs)
  # - ht_capsnet_exponential (uses start_epoch and decay_rate)
  # - timm schedulers via timm.create_scheduler_v2 (e.g., cosine, step)
  name: cosine

  # Used by hiercos_cosine and HRN cosine path; optional for other schedulers.
  base_lr: 0.0005

  # Common timm scheduler kwargs (ignored when unsupported by selected sched).
  warmup_lr: 0.000001
  min_lr: 0.00001
  noise: null
  noise_pct: 0.67
  noise_std: 1.0
  noise_seed: 42
  decay_epochs: 30
  warmup_epochs: 5
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1
  start_epoch: 10                   # HT-CapsNet: epoch index where exponent starts at zero

runtime:
  deterministic: true               # Enable deterministic algorithms / reproducibility guards
